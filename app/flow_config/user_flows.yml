slots:
  order_id:
    type: text
    label: 订单号
    description: 用户的听书平台订单号
  refund_reason:
    type: text
    label: 退款原因
    description: 申请退款的原因
  refund_type:
    type: text
    label: 退款类型
    description: 全额退款或部分退款
  refund_amount:
    type: number
    label: 退款金额
    description: 部分退款时申请退还的金额
  ticket_type:
    type: text
    label: 工单类型
    description: 播放异常、投诉、退款、账号问题、建议或其他
  issue_desc:
    type: text
    label: 问题描述
    description: 用户遇到的问题或希望反馈的内容
  book_name:
    type: text
    label: 专辑名称
    description: 用户希望查询的有声书或专辑名称

flows:
  refund_request:
    name: 退款申请
    description: 帮用户提交退款申请，收集订单号、退款原因和退款类型后提交退款。
    steps:
      - id: start
        type: start
        next: ask_order_id
      - id: ask_order_id
        type: collect
        slot_name: order_id
        template:
          mode: static
          text: 请告诉我你要退款的订单号。
        next: ask_refund_reason
      - id: ask_refund_reason
        type: collect
        slot_name: refund_reason
        template:
          mode: static
          text: 请简单说一下退款原因。
        next: ask_refund_type
      - id: ask_refund_type
        type: collect
        slot_name: refund_type
        template:
          mode: static
          text: 请选择全额退款或部分退款；部分退款请同时说明金额。
        next:
          full: submit_refund
          partial: ask_refund_amount
      - id: ask_refund_amount
        type: collect
        slot_name: refund_amount
        template:
          mode: static
          text: 请提供部分退款金额（元）。
        next: submit_refund
      - id: submit_refund
        type: action
        action: action_submit_refund
        next: show_refund_result
      - id: show_refund_result
        type: response
        template:
          mode: rephrase
          text: "{{ slots.refund_result }}"
        next: end
      - id: end
        type: end
        next: []
  ticket_submit:
    name: 客服工单
    description: 收集工单类型、可选关联订单和问题描述后提交客服工单。
    steps:
      - id: start
        type: start
        next: ask_ticket_type
      - id: ask_ticket_type
        type: collect
        slot_name: ticket_type
        template:
          mode: static
          text: 请选择工单类型：播放异常、投诉、退款、账号问题、建议或其他。
        next: ask_ticket_order
      - id: ask_ticket_order
        type: collect
        slot_name: order_id
        template:
          mode: static
          text: 请提供关联订单号；没有关联订单可回复“无”。
        next: ask_issue_desc
      - id: ask_issue_desc
        type: collect
        slot_name: issue_desc
        template:
          mode: static
          text: 请描述遇到的问题。
        next: submit_ticket
      - id: submit_ticket
        type: action
        action: action_submit_ticket
        next: show_ticket_result
      - id: show_ticket_result
        type: response
        template:
          mode: rephrase
          text: "{{ slots.ticket_result }}"
        next: end
      - id: end
        type: end
        next: []
  order_query:
    name: 订单查询
    description: 根据订单号查询订单状态和商品信息。
    steps:
      - id: start
        type: start
        next: ask_order_id
      - id: ask_order_id
        type: collect
        slot_name: order_id
        template:
          mode: static
          text: 请提供要查询的订单号。
        next: query_order
      - id: query_order
        type: action
        action: action_query_order
        next: show_order_result
      - id: show_order_result
        type: response
        template:
          mode: rephrase
          text: "{{ slots.order_result }}"
        next: end
      - id: end
        type: end
        next: []
  playback_query:
    name: 收听进度查询
    description: 查询当前用户最近的收听进度。
    steps:
      - id: start
        type: start
        next: query_playback
      - id: query_playback
        type: action
        action: action_query_playback
        next: show_playback_result
      - id: show_playback_result
        type: response
        template:
          mode: rephrase
          text: "{{ slots.playback_result }}"
        next: end
      - id: end
        type: end
        next: []
  purchase:
    name: 前往购买
    description: 引导用户在听书客户端打开专辑并完成购买。
    steps:
      - id: start
        type: start
        next: show_purchase_guide
      - id: show_purchase_guide
        type: action
        action: action_purchase_guide
        next: show_purchase_result
      - id: show_purchase_result
        type: response
        template:
          mode: rephrase
          text: "{{ slots.purchase_result }}"
        next: end
      - id: end
        type: end
        next: []
