services:
  mysql:
    image: mysql:8.0
    container_name: listen-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-commerce2026}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-commerce2026}"]
      interval: 5s
      timeout: 5s
      retries: 30

  audio-data-init:
    build: ./audio-data
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-commerce2026}
      DB_NAME: audio_data
      APP_PORT: 8000
    depends_on:
      mysql: {condition: service_healthy}
    command: ["sh", "docker/init_if_empty.sh"]
    restart: "no"

  audio-data:
    build: ./audio-data
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-commerce2026}
      DB_NAME: audio_data
      APP_PORT: 8000
    depends_on:
      audio-data-init: {condition: service_completed_successfully}
    ports: ["8000:8000"]
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  customer-service:
    build: .
    env_file: [.env]
    environment:
      LISTEN_CS_DSN: mysql://root:${MYSQL_ROOT_PASSWORD:-commerce2026}@mysql:3306/listen_cs
      AUDIO_DATA_BASE_URL: http://audio-data:8000
    depends_on:
      mysql: {condition: service_healthy}
      audio-data: {condition: service_started}
    ports: ["8001:8001"]
    restart: unless-stopped

  debug-ui:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [customer-service]
    restart: unless-stopped

volumes:
  mysql_data:
